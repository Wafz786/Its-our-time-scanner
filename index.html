<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IT'S OUR TIME - Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
      padding: 20px;
    }

    .box {
      background: white;
      max-width: 500px;
      margin: auto;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
    }

    h1 {
      font-size: 28px;
      margin-bottom: 5px;
    }

    .subtitle {
      font-size: 16px;
      margin-bottom: 25px;
    }

    input {
      width: 90%;
      max-width: 300px;
      padding: 14px;
      font-size: 20px;
      text-align: center;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 15px;
      box-sizing: border-box;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    #status {
      font-size: 20px;
      margin: 20px 0;
    }

    button {
      padding: 15px 25px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #222;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>IT'S OUR TIME</h1>

  <p class="subtitle">
    <strong>PRIVATE TICKET SCANNER</strong>
  </p>

  <input
    type="password"
    id="pin"
    placeholder="Enter scanner PIN"
    inputmode="numeric"
    autocomplete="off"
  >

  <br>

  <button onclick="startScanner()">
    START SCANNER
  </button>

  <div id="status">
    Enter your PIN to start.
  </div>

  <div id="reader"></div>

</div>

<script>

const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbxjwrPL4Z9qEw0Lq9uJU53OrBInh5pZ_hog4ABj271r9b5HcCc-N04_snMXeipfQC0j/exec";

let scanner = null;
let processing = false;


function startScanner() {

  if (processing) return;

  let pin =
    document.getElementById("pin").value.trim();

  if (!pin) {
    pin = sessionStorage.getItem("scannerPin") || "";
  }

  if (!pin) {

    document.getElementById("status").innerHTML =
      "Please enter the scanner PIN.";

    return;
  }

  sessionStorage.setItem("scannerPin", pin);
    { facingMode: "environment" },

    {
      fps: 10,
      qrbox: {
        width: 250,
        height: 250
      }
    },

    function(decodedText) {

      if (processing) return;

      processing = true;

      scanner.stop();

      document.getElementById("status").innerHTML =
        "Checking ticket...";

      let ticketId = "";

      try {

        const url = new URL(decodedText);

        ticketId =
          url.searchParams.get("ticket") || "";

      } catch (error) {

        ticketId =
          decodedText.trim();

      }

      if (!ticketId) {

        document.getElementById("status").innerHTML =
          "INVALID QR CODE";

        processing = false;

        return;
      }

      const resultUrl =
        WEB_APP_URL +
        "?pin=" +
        encodeURIComponent(pin) +
        "&ticket=" +
        encodeURIComponent(ticketId);

     window.open(resultUrl, "_blank");

    }

  ).catch(function(error) {

    document.getElementById("status").innerHTML =
      "CAMERA ERROR: Please allow camera access.";

    console.log(error);

  });

}

</script>

</body>
</html>
