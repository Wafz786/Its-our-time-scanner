<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IT'S OUR TIME - Scanner</title>

  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
      padding: 20px;
      margin: 0;
    }

    .box {
      background: white;
      max-width: 500px;
      margin: auto;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
    }

    h1 {
      font-size: 28px;
      margin-bottom: 5px;
    }

    .subtitle {
      font-size: 16px;
      margin-bottom: 25px;
    }

    input {
      width: 90%;
      max-width: 300px;
      padding: 14px;
      font-size: 20px;
      text-align: center;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 15px;
      box-sizing: border-box;
    }

    button {
      padding: 15px 25px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      cursor: pointer;
      margin: 5px;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    #status {
      font-size: 18px;
      margin: 20px 0;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>IT'S OUR TIME</h1>

  <p class="subtitle">
    <strong>PRIVATE TICKET SCANNER</strong>
  </p>

  <input
    type="password"
    id="pin"
    placeholder="Enter scanner PIN"
    inputmode="numeric"
    autocomplete="off"
  >

  <br>

  <button id="startButton" type="button">
    START SCANNER
  </button>

  <button id="clearButton" type="button">
    CLEAR PIN
  </button>

  <div id="status">
    Enter your PIN to start.
  </div>

  <div id="reader"></div>

</div>

<script>

const WEB_APP_URL =
  "https://script.google.com/macros/s/AKfycbxjwrPL4Z9qEw0Lq9uJU53OrBInh5pZ_hog4ABj271r9b5HcCc-N04_snMXeipfQC0j/exec";

let scanner = null;
let pin = "";
let processing = false;


const pinInput =
  document.getElementById("pin");

const startButton =
  document.getElementById("startButton");

const clearButton =
  document.getElementById("clearButton");

const statusBox =
  document.getElementById("status");


/*
========================================
LOAD PIN
========================================
*/

function loadPin() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  const urlPin =
    params.get("pin");

  if (urlPin) {

    pin = urlPin;

    localStorage.setItem(
      "scannerPin",
      pin
    );

    pinInput.value = pin;

    statusBox.innerText =
      "PIN loaded. Tap START SCANNER.";

    return;
  }


  const savedPin =
    localStorage.getItem(
      "scannerPin"
    );

  if (savedPin) {

    pin = savedPin;

    pinInput.value = savedPin;

    statusBox.innerText =
      "PIN remembered. Tap START SCANNER.";

  }

}


/*
========================================
CLEAR PIN
========================================
*/

clearButton.onclick = function() {

  localStorage.removeItem(
    "scannerPin"
  );

  pin = "";

  pinInput.value = "";

  statusBox.innerText =
    "PIN cleared. Enter your PIN.";

};


/*
========================================
START SCANNER
========================================
*/

startButton.onclick = async function() {

  pin =
    pinInput.value.trim();


  if (!pin) {

    pin =
      localStorage.getItem(
        "scannerPin"
      ) || "";

  }


  if (!pin) {

    statusBox.innerText =
      "Please enter your scanner PIN.";

    return;

  }


  localStorage.setItem(
    "scannerPin",
    pin
  );


  startButton.disabled =
    true;


  statusBox.innerText =
    "Opening camera...";


  try {

    scanner =
      new Html5Qrcode(
        "reader"
      );


    await scanner.start(

      {
        facingMode: "environment"
      },

      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        }
      },


      async function(decodedText) {

        if (processing) {
          return;
        }

        processing = true;

        statusBox.innerText =
          "Checking ticket...";


        try {
          await scanner.stop();
        } catch (e) {
          console.log(e);
        }


        let ticketId = "";


        try {

          const url =
            new URL(decodedText);

          ticketId =
            url.searchParams.get(
              "ticket"
            ) || "";

        } catch (e) {

          ticketId =
            decodedText.trim();

        }


        if (!ticketId) {

          statusBox.innerText =
            "INVALID QR CODE";

          processing = false;

          startButton.disabled =
            false;

          return;

        }


        const resultUrl =
          WEB_APP_URL +
          "?pin=" +
          encodeURIComponent(pin) +
          "&ticket=" +
          encodeURIComponent(ticketId);


        window.location.href =
          resultUrl;

      }

    );


    statusBox.innerText =
      "SCANNER READY — Scan a ticket.";


  } catch (error) {

    console.error(error);

    statusBox.innerText =
      "CAMERA ERROR — Please allow camera access.";

    startButton.disabled =
      false;

  }

};


/*
========================================
START
========================================
*/

loadPin();

</script>

</body>
</html>
