<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IT'S OUR TIME - Scanner</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
      padding: 20px;
      margin: 0;
    }

    .box {
      background: white;
      max-width: 500px;
      margin: auto;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
    }

    h1 {
      font-size: 28px;
      margin-bottom: 5px;
    }

    .subtitle {
      font-size: 16px;
      margin-bottom: 25px;
    }

    input {
      width: 90%;
      max-width: 300px;
      padding: 14px;
      font-size: 20px;
      text-align: center;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-bottom: 15px;
      box-sizing: border-box;
    }

    button {
      padding: 15px 25px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      cursor: pointer;
      margin: 5px;
    }

    button:disabled {
      opacity: 0.5;
    }

    #reader {
      width: 100%;
      margin-top: 20px;
    }

    #status {
      font-size: 18px;
      margin: 20px 0;
      line-height: 1.5;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>IT'S OUR TIME</h1>

  <p class="subtitle">
    <strong>PRIVATE TICKET SCANNER</strong>
  </p>

  <input
    type="password"
    id="pin"
    placeholder="Enter scanner PIN"
    inputmode="numeric"
    autocomplete="off"
  >

  <br>

  <button id="startButton" type="button">
    START SCANNER
  </button>

  <button id="clearPinButton" type="button">
    CLEAR PIN
  </button>

  <div id="status">
    Enter your PIN to start.
  </div>

  <div id="reader"></div>

</div>

<script>

const WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbxjwrPL4Z9qEw0Lq9uJU53OrBInh5pZ_hog4ABj271r9b5HcCc-N04_snMXeipfQC0j/exec";

let scanner = null;
let processing = false;

const pinInput =
  document.getElementById("pin");

const statusBox =
  document.getElementById("status");

const startButton =
  document.getElementById("startButton");

const clearPinButton =
  document.getElementById("clearPinButton");


/*
  LOAD SAVED PIN
*/

window.addEventListener("load", function() {

  const savedPin =
    localStorage.getItem("scannerPin");

  if (savedPin) {

    pinInput.value = savedPin;

    statusBox.innerText =
      "PIN remembered. Tap START SCANNER.";

  }

});


/*
  CLEAR SAVED PIN
*/

clearPinButton.addEventListener("click", function() {

  localStorage.removeItem("scannerPin");

  pinInput.value = "";

  statusBox.innerText =
    "PIN cleared. Enter your scanner PIN.";

});


/*
  START SCANNER
*/

startButton.addEventListener("click", startScanner);


async function startScanner() {

  if (processing) return;

  let pin =
    pinInput.value.trim();

  /*
    If the box is empty, use the
    saved PIN from the phone.
  */

  if (!pin) {

    pin =
      localStorage.getItem("scannerPin") || "";

  }

  if (!pin) {

    statusBox.innerText =
      "Please enter the scanner PIN.";

    return;

  }


  /*
    SAVE PIN FOR FUTURE SCANS
  */

  localStorage.setItem(
    "scannerPin",
    pin
  );


  /*
    SHOW CAMERA MESSAGE
  */

  statusBox.innerText =
    "Opening camera...";


  /*
    CREATE QR SCANNER
  */

  scanner =
    new Html5Qrcode("reader");


  try {

    await scanner.start(

      { facingMode: "environment" },

      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        }
      },

      async function(decodedText) {

        if (processing) return;

        processing = true;

        statusBox.innerText =
          "Checking ticket...";


        /*
          STOP CAMERA
        */

        try {

          await scanner.stop();

        } catch (error) {

          console.log(error);

        }


        /*
          GET TICKET ID FROM QR
        */

        let ticketId = "";

        try {

          const url =
            new URL(decodedText);

          ticketId =
            url.searchParams.get("ticket") || "";

        } catch (error) {

          ticketId =
            decodedText.trim();

        }


        /*
          INVALID QR
        */

        if (!ticketId) {

          statusBox.innerText =
            "INVALID QR CODE";

          processing = false;

          return;

        }


        /*
          SEND TICKET + PIN TO BACKEND
        */

        const resultUrl =
          WEB_APP_URL +
          "?pin=" +
          encodeURIComponent(pin) +
          "&ticket=" +
          encodeURIComponent(ticketId);


        /*
          OPEN VERIFICATION RESULT
        */

        window.location.href =
          resultUrl;

      }

    );


    statusBox.innerText =
      "SCANNER READY — Scan a ticket.";


  } catch (error) {

    console.error(error);

    statusBox.innerText =
      "CAMERA ERROR — Please allow camera access.";

    processing = false;

  }

}

</script>

</body>
</html>
